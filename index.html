<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <style>
        /* ========================================================
           FONTES LOCAIS
           ======================================================== */
        @font-face {
            font-family: 'Coolvetica';
            src: url('coolvetica rg cram.otf') format('opentype'); 
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Montserrat';
            src: url('montserrat-regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Montserrat';
            src: url('montserrat-medio.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }

        /* ========================================================
           CONFIGURAÇÕES GERAIS
           ======================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', Arial, sans-serif;
        }

        body {
            background-color: #000000; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 4vh 3vh;
            width: 100%;
            overflow-x: hidden;
        }

        /* ========================================================
           VÍDEO DE FUNDO ROTACIONADO 90 GRAUS (PADRÃO CELULAR)
           ======================================================== */
        .video-fundo {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            object-fit: cover;
            opacity: 0.05; 
            z-index: -1;
            pointer-events: none;
        }

        .container-celular {
            width: 100%;
            max-width: 70vh;
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
            z-index: 1;
        }

        /* ========================================================
           ANIMAÇÕES DE ENTRADA
           ======================================================== */
        @keyframes subirEVer {
            0% {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* ========================================================
           TOPO: FOTO, NOME E LINKS
           ======================================================== */
        .topo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .perfil-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 1.5vh;
            background-color: #57575700;
            border-radius: 1vh;
            container-type: inline-size;
        }

        .foto-perfil {
            width: 25%; 
            aspect-ratio: 1 / 1; 
            flex-shrink: 0;   
            background-color: #ff000000;
        }

        .foto-perfil img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            display: block;
        }

        .nome-perfil {
            font-family: 'Coolvetica', Arial, sans-serif;
            letter-spacing: 0.05vh;
            color: #ffffff;
            white-space: nowrap;
            font-size: 27cqw;
            margin-top: -0.7vh;
            display: flex;
            align-items: center;
            background-color: #ff000000;
            animation: expandirEspaco 1s ease-out forwards;
        }

        @keyframes expandirEspaco {
            from { letter-spacing: 0.05vh; }
            to { letter-spacing: 0.3vh; }
        }

        .botoes-topo {
            display: flex;
            width: 100%;
            gap: 1.5vh;
            animation: subirEVer 0.8s ease-out forwards;
        }

        .botao-topo {
            flex: 1;
            background-color: #1a1a1a;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px 5px;
            border-radius: 1.5vh;
            font-size: 1.8vh;
            font-weight: bold;
            border: 1px solid #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icone-botao {
            width: 3.3vh;
            height: 3.3vh;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* ========================================================
           TEXTO DE CHAMADA / DESTAQUE
           ======================================================== */
        .chamada {
            text-align: center;
            font-size: 2vh;
            line-height: 1.6;
            color: #e0e0e0;
            padding: 0 5px;
            text-transform: uppercase;
            opacity: 0;
            animation: subirEVer 0.8s ease-out 0.15s forwards;
        }

        .chamada strong {
            color: #4661ff;
            font-family: 'Montserrat', Arial, sans-serif;
            font-weight: 500;
        }

        /* Container para alinhar os cards (Padrão celular: coluna) */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
        }

        /* ========================================================
           ESTILIZAÇÃO DAS IMAGENS COMO BOTÕES
           ======================================================== */
        .botao-imagem {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            object-fit: contain;
            cursor: pointer;
            opacity: 0;
        }

        .img-laranja { animation: subirEVer 0.8s ease-out 0.3s forwards; }
        .img-roxo { animation: subirEVer 0.8s ease-out 0.45s forwards; }
        .img-vermelho { animation: subirEVer 0.8s ease-out 0.6s forwards; }

        /* ========================================================
           RODAPÉ
           ======================================================== */
        .rodape {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            opacity: 0;
            animation: subirEVer 0.8s ease-out 0.75s forwards;
        }

        /* ========================================================
           MUDANÇAS REQUISITADAS PARA O COMPUTADOR (DESKTOP)
           ======================================================== */
        @media (min-width: 992px) {
            body {
                padding: 6vh 5vw;
                align-items: center;
            }

            /* Remove a rotação de 90° do vídeo no PC */
            .video-fundo {
                width: 100vw;
                height: 100vh;
                transform: translate(-50%, -50%) rotate(0deg);
            }

            /* Permite o site expandir horizontalmente */
            .container-celular {
                max-width: 1200px;
                gap: 40px;
            }

            /* Transforma o topo em Grid para alinhar igual à sua imagem */
            .topo {
                display: grid;
                grid-template-columns: 160px 1fr;
                grid-template-areas: 
                    "foto nome"
                    "foto botoes";
                gap: 10px 35px;
                align-items: center;
                justify-content: start;
                width: auto;
                margin: 0 auto;
            }

            /* Hack CSS necessário para reposicionar os filhos no Grid */
            .perfil-container {
                display: contents; 
            }

            .foto-perfil {
                grid-area: foto;
                width: 160px;
            }

            /* Nome grande e imponente à direita da foto */
            .nome-perfil {
                grid-area: nome;
                font-size: 85px; 
                line-height: 1;
                margin-top: 0;
                justify-content: flex-start;
            }

            /* Botões do topo alinhados horizontalmente abaixo do nome */
            .botoes-topo {
                grid-area: botoes;
                width: auto;
                gap: 15px;
                justify-content: flex-start;
            }

            .botao-topo {
                flex: none;
                width: 200px;
                padding: 12px 20px;
                font-size: 16px;
                border-radius: 8px;
            }

            /* Centraliza a chamada e ajusta o tamanho no desktop */
            .chamada {
                font-size: 20px;
                letter-spacing: 1px;
                margin: 15px 0;
            }

            /* Organiza os 3 cards principais lado a lado */
            .cards-container {
                flex-direction: row;
                gap: 20px;
            }

            .cards-container a {
                flex: 1;
            }

            /* Efeito opcional de passar o mouse por cima (hover) */
            .botao-imagem {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .botao-imagem:hover {
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="video-fundo">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="container-celular">
        
        <header class="topo">
            <div class="perfil-container">
                <div class="foto-perfil">
                    <img src="perfil recortada.jpg" alt="Foto de Perfil">
                </div>
                <h1 class="nome-perfil">KALEB DESIGNS</h1>
            </div>
            
            <div class="botoes-topo">
                <a href="https://wa.me/558491297525?text=Quero%20saber%20os%20valores" target="_blank" class="botao-topo">
                    <img src="wh.png" alt="WhatsApp" class="icone-botao">
                    WhatsApp
                </a>
                <a href="#" class="botao-topo">
                    <img src="bh.png" alt="Behance" class="icone-botao">
                    Behance
                </a>
            </div>
        </header>

        <section class="chamada">
            <p>Mude como seu <strong>perfil é visto </strong>pelas pessoas e <strong>transforme sua marca</strong></p>
        </section>

        <div class="cards-container">
            <a href="https://wa.me/558491297525?text=Quero%20saber%20os%20valores" target="_blank">
                <img src="b1.png" alt="Quero saber os valores" class="botao-imagem img-laranja">
            </a>

            <a href="#" target="_blank">
                <img src="b2.png" alt="Solicitar orçamentos" class="botao-imagem img-roxo">
            </a>

            <a href="https://instagram.com/kaleb_designer" target="_blank">
                <img src="b3.png" alt="Acessar Instagram" class="botao-imagem img-vermelho">
            </a>
        </div>

        <footer class="rodape">
            <p>© 2026 @kaleb_designer</p>
        </footer>

    </div>

    <script>
        document.querySelector('.video-fundo').playbackRate = 0.5;
    </script>
</body>
</html>
